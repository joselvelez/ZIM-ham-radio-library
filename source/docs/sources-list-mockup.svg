  <text x="770" y="278" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="13">120 MB</text>
  <text x="850" y="278" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">antennas</text>
  <line x1="32" y1="290" x2="928" y2="290" stroke="#243"/>
  <!-- row 4 -->
  <text x="32" y="318" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">Icom IC-7300 Service Manual</text>
  <text x="230" y="318" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="12">ic-7300-service.pdf</text>
