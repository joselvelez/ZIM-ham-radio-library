  <line x1="32" y1="330" x2="928" y2="330" stroke="#243"/>
  <text x="32" y="370" fill="#8aa" font-family="system-ui,sans-serif" font-size="12">Click a SHA-256 to copy. Search filters the table in place. Regenerated from the manifest on every pipeline run.</text>
</svg>
