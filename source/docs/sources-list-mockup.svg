<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#0c121c"/>
  <text x="32" y="48" fill="#ffdc50" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Source list</text>
  <text x="32" y="78" fill="#c5d0dc" font-family="system-ui,sans-serif" font-size="13">Browse and search ingested sources. SHA-256 identifies the exact PDF bytes. Click a hash to copy.</text>
  <rect x="32" y="96" width="420" height="32" rx="4" fill="#1a2230" stroke="#345"/>
  <text x="44" y="117" fill="#8aa" font-family="system-ui,sans-serif" font-size="13">Search title, filename, hash, location, category…</text>
  <!-- header -->
  <text x="32" y="160" fill="#8cf" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Title</text>
  <text x="230" y="160" fill="#8cf" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Filename</text>
  <text x="500" y="160" fill="#8cf" font-family="system-ui,sans-serif" font-size="13" font-weight="600">SHA-256</text>
  <text x="680" y="160" fill="#8cf" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Location</text>
  <text x="770" y="160" fill="#8cf" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Size</text>
  <text x="850" y="160" fill="#8cf" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Category</text>
  <line x1="32" y1="170" x2="928" y2="170" stroke="#243"/>
  <!-- row 1 -->
  <text x="32" y="198" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">FT-857 Operators Manual</text>
  <text x="230" y="198" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="12">nav-comms_P2_ft-857….pdf</text>
  <text x="500" y="198" fill="#e8eef5" font-family="ui-monospace,monospace" font-size="11">e3a1…b766</text>
  <text x="680" y="198" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="13">basic</text>
  <text x="770" y="198" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="13">4.2 MB</text>
  <text x="850" y="198" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">manuals</text>
  <line x1="32" y1="210" x2="928" y2="210" stroke="#243"/>
  <!-- row 2 -->
  <text x="32" y="238" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">Sample 40m Band Plan</text>
  <text x="230" y="238" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="12">sample-band-plan.pdf</text>
  <text x="500" y="238" fill="#e8eef5" font-family="ui-monospace,monospace" font-size="11">e927…2b42</text>
  <text x="680" y="238" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="13">basic</text>
  <text x="770" y="238" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="13">3.1 KB</text>
  <text x="850" y="238" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">band-plans</text>
  <line x1="32" y1="250" x2="928" y2="250" stroke="#243"/>
  <!-- row 3 -->
  <text x="32" y="278" fill="#64b4ff" font-family="system-ui,sans-serif" font-size="13">ARRL Antenna Book excerpt</text>
  <text x="230" y="278" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="12">arrl-antenna-excerpt.pdf</text>
